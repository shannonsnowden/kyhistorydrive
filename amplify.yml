version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # Validate and publish committed public/data/app/ (OTA source of truth).
        # Does not pull ky-markers-drive unless SYNC_FROM_MARKERS=1.
        # Amplify must NOT set SYNC_FROM_MARKERS.
        - npm run sync-app-data
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# Magazine homepage is `/`. Keep hash routes (#map, #timeline, #about, #app)
# on the same document. Do not add a catch-all SPA rewrite.
# Old /home-preview links redirect to the live home.
customRules:
  - source: '/home-preview'
    target: '/'
    status: '301'
  - source: '/home-preview/'
    target: '/'
    status: '301'
  - source: '/home-preview/<*>'
    target: '/'
    status: '301'
