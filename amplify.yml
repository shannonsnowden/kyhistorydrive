version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # Refresh iOS JSON from ky-markers-drive when a token is set; otherwise
        # publish the committed copies in public/data/app/.
        - npm run sync-app-data
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# Serve the draft marketing homepage without replacing `/` (the map).
# Do not add a catch-all SPA rewrite — hash routes on `/` stay as they are.
customRules:
  - source: '/home-preview'
    target: '/home-preview/index.html'
    status: '200'
  - source: '/home-preview/'
    target: '/home-preview/index.html'
    status: '200'
