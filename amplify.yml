# Magazine homepage is `/`. Keep hash routes (#map, #timeline, #about, #app, #resources)
# on the same document. Do not add a catch-all SPA rewrite — it would swallow
# /privacy (no file extension) and /sitemap.xml (.xml is outside Amplify's
# usual static-extension exclusion list). /robots.txt is a real file.
# /stories/<slug>/, /layers/<id>/, and /videos/ are prerendered index.html
# files from scripts/prerender-pages.mjs. The rules below do not match
# /stories/ or /layers/. /videos follows the /about slash rules.
# Old /home-preview links redirect to the live home.
customRules:
  - source: '/home-preview'
    target: '/'
    status: '301'
  - source: '/home-preview/'
    target: '/'
    status: '301'
  - source: '/home-preview/<*>'
    target: '/'
    status: '301'
  - source: '/privacy'
    target: '/privacy/index.html'
    status: '200'
  - source: '/privacy/'
    target: '/privacy/index.html'
    status: '200'
  # Slashless /about matches the live /privacy behavior: 301 to the
  # trailing-slash URL. /privacy's 301 is S3's directory redirect, not a
  # 301 rule in this file (the /privacy rule below is still a 200 rewrite).
  - source: '/about'
    target: '/about/'
    status: '301'
  - source: '/about/'
    target: '/about/index.html'
    status: '200'
  - source: '/videos'
    target: '/videos/'
    status: '301'
  - source: '/videos/'
    target: '/videos/index.html'
    status: '200'
