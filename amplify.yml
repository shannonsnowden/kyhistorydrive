version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # OTA SoT is committed public/data/app/. sync-app-data is a no-op unless
        # SYNC_IOS_BUNDLE=1 is set in Amplify (do not set for daily content deploys).
        - npm run sync-app-data
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# Magazine homepage is `/`. Keep hash routes (#map, #timeline, #about, #app)
# on the same document. Do not add a catch-all SPA rewrite.
# Old /home-preview links redirect to the live home.
customRules:
  - source: '/home-preview'
    target: '/'
    status: '301'
  - source: '/home-preview/'
    target: '/'
    status: '301'
  - source: '/home-preview/<*>'
    target: '/'
    status: '301'
