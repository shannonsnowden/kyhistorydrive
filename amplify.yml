    target: '/privacy/index.html'
    status: '200'
  # Slashless /about matches the live /privacy behavior: 301 to the
  # trailing-slash URL. /privacy's 301 is S3's directory redirect, not a
  # 301 rule in this file (the /privacy rule below is still a 200 rewrite).
  - source: '/about'
    target: '/about/'
    status: '301'
  - source: '/about/'
    target: '/about/index.html'
    status: '200'
  - source: '/videos'
    target: '/videos/'
    status: '301'
  - source: '/videos/'
    target: '/videos/index.html'
    status: '200'
  # /timeline is a hash route (/#timeline). Amplify rules cannot target a #fragment, so
  # /timeline/ serves a tiny static stub (public/timeline/index.html) that forwards with
  # location.replace + meta refresh. Slashless /timeline follows the /about slash rules.
  - source: '/timeline'
    target: '/timeline/'
    status: '301'
  - source: '/timeline/'
    target: '/timeline/index.html'
    status: '200'
  # Drives live at /drives/ (index, /drives/<slug>/ pages, /drives/build/ planner), served as
  # static index.html files. Slashless /drives follows the /about slash rules. The old
  # /drive-preview/ paths from the preview build redirect permanently to the same page under /drives/.
  - source: '/drives'
    target: '/drives/'
    status: '301'
  - source: '/drive-preview'
    target: '/drives/'
    status: '301'
  - source: '/drive-preview/'
    target: '/drives/'
    status: '301'
  - source: '/drive-preview/<*>'
    target: '/drives/<*>'
    status: '301'
