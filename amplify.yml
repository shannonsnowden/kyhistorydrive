version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # Validate and publish committed public/data/app/ (OTA source of truth).
        # Does not pull ky-markers-drive unless SYNC_FROM_MARKERS=1.
        # Amplify must NOT set SYNC_FROM_MARKERS.
        - npm run sync-app-data
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# Magazine homepage is `/`. Keep hash routes (#map, #timeline, #about, #app, #resources)
# on the same document. Do not add a catch-all SPA rewrite — it would swallow
# /privacy (no file extension) and /sitemap.xml (.xml is outside Amplify's
# usual static-extension exclusion list). /robots.txt is a real file.
# /stories/<slug>/, /layers/<id>/, and /videos/ are prerendered index.html
# files from scripts/prerender-pages.mjs.
# Item 90: the 301s (old slugs, /home-preview, /drive-preview, Roads & Rails) and the
# unknown-path 404 now live in the Amplify console rewrites and redirects. The four
# slashless 301s below (/about, /videos, /timeline, /drives) are not in the console,
# so they stay here; the rest of this list is the 200 rewrites.
customRules:
  - source: '/privacy'
    target: '/privacy/index.html'
    status: '200'
  - source: '/privacy/'
    target: '/privacy/index.html'
    status: '200'
  - source: '/about'
    target: '/about/'
    status: '301'
  - source: '/about/'
    target: '/about/index.html'
    status: '200'
  - source: '/videos'
    target: '/videos/'
    status: '301'
  - source: '/videos/'
    target: '/videos/index.html'
    status: '200'
  - source: '/timeline'
    target: '/timeline/'
    status: '301'
  - source: '/timeline/'
    target: '/timeline/index.html'
    status: '200'
  - source: '/drives'
    target: '/drives/'
    status: '301'
