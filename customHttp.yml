# Amplify custom headers (repo root). Overrides the default 1-year CloudFront
# cache so iOS data_version bumps are visible soon after deploy.
# https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html
customHeaders:
  - pattern: '/data/app/*.json'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, s-maxage=60, must-revalidate'
      - key: 'Access-Control-Allow-Origin'
        value: '*'
      - key: 'Access-Control-Allow-Methods'
        value: 'GET, HEAD, OPTIONS'
      - key: 'Content-Type'
        value: 'application/json; charset=utf-8'
  # ads.txt is a static file (public/ads.txt). Pin text/plain so a missing
  # console MIME guess cannot serve it as HTML. This is not a rewrite.
  - pattern: '/ads.txt'
    headers:
      - key: 'Content-Type'
        value: 'text/plain'
  - pattern: '/robots.txt'
    headers:
      - key: 'Content-Type'
        value: 'text/plain; charset=utf-8'
  - pattern: '/sitemap.xml'
    headers:
      - key: 'Content-Type'
        value: 'application/xml; charset=utf-8'
  - pattern: '/sitemap-videos.xml'
    headers:
      - key: 'Content-Type'
        value: 'application/xml; charset=utf-8'
  - pattern: '/privacy'
    headers:
      - key: 'Content-Type'
        value: 'text/html; charset=utf-8'
  - pattern: '/privacy/'
    headers:
      - key: 'Content-Type'
        value: 'text/html; charset=utf-8'
  - pattern: '/about'
    headers:
      - key: 'Content-Type'
        value: 'text/html; charset=utf-8'
  - pattern: '/about/'
    headers:
      - key: 'Content-Type'
        value: 'text/html; charset=utf-8'
  - pattern: '/videos'
    headers:
      - key: 'Content-Type'
        value: 'text/html; charset=utf-8'
  - pattern: '/videos/'
    headers:
      - key: 'Content-Type'
        value: 'text/html; charset=utf-8'
